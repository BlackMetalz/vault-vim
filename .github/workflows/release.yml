# Release workflow - triggered on tag push
# Builds Linux binary and creates GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v0.1.0, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # fix permission to create release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.2'

    - name: Run tests
      run: go test -v ./...

    - name: Build Linux amd64
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -trimpath \
          -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
          -o vault-vim-linux-amd64 .

    - name: Build Darwin amd64
      run: |
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
          -trimpath \
          -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
          -o vault-vim-darwin-amd64 .

    - name: Build Darwin arm64
      run: |
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
          -trimpath \
          -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
          -o vault-vim-darwin-arm64 .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          vault-vim-linux-amd64
          vault-vim-darwin-amd64
          vault-vim-darwin-arm64
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
